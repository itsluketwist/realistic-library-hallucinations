name: release
on:
  workflow_dispatch:

jobs:

  pypi:
    name: Publish to PyPI

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: benchmark

    environment:
      name: release
      url: https://pypi.org/p/lhab

    permissions:
      id-token: write

    steps:

      - name: 1. Checkout the code...
        uses: actions/checkout@v4

      - name: 2. Configure uv...
        uses: astral-sh/setup-uv@v6

      - name: 3. Build the package...
        run: uv build

      - name: 4. Publish package to PyPI
        run: uv publish --trusted-publishing always

  huggingface:
    name: Upload to Hugging Face

    runs-on: ubuntu-latest

    environment:
      name: release
      url: https://huggingface.co/datasets/itsluketwist/LHAB

    steps:

      - name: 1. Checkout the code...
        uses: actions/checkout@v4

      - name: 2. Install huggingface_hub...
        run: pip install huggingface_hub

      - name: 3. Upload dataset to Hugging Face Hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          huggingface-cli upload itsluketwist/LHAB benchmark/HF_README.md README.md --repo-type dataset
          huggingface-cli upload itsluketwist/LHAB benchmark/lhab/lhab-control.jsonl control.jsonl --repo-type dataset
          huggingface-cli upload itsluketwist/LHAB benchmark/lhab/lhab-describe.jsonl describe.jsonl --repo-type dataset
          huggingface-cli upload itsluketwist/LHAB benchmark/lhab/lhab-specify.jsonl specify.jsonl --repo-type dataset
